name: Build BLACKOUT CITY APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: unzip -o blackout_city_build22_cloud_apk.zip -d game

      - name: Download legacy UMD Three.js for WebView
        run: |
          mkdir -p game/app/src/main/assets
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js \
            --output game/app/src/main/assets/three.min.js
          test -s game/app/src/main/assets/three.min.js
          test "$(wc -c < game/app/src/main/assets/three.min.js)" -gt 100000
          if grep -q 'export {' game/app/src/main/assets/three.min.js; then echo 'Expected classic UMD build, got ES module'; exit 1; fi

      - name: Build APK
        run: gradle -p game assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-CITY-APK-BUILD22
          path: game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
